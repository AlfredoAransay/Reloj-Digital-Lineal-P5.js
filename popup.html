<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reloj Digital Lineal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-contenedor">
        <!-- El canvas de p5.js se inyectará aquí por DOM -->
        <div id="botones">
            <!-- Botón para alternar entre 24h o 12h -->
            <button id="formato-toggle" title="Cambiar modo 24h o 12h">24H</button>
            <!-- Botón para alternar el tema DARK o LIGHT -->
            <button id="tema-toggle" title="Cambiar tema">THEME</button>
        </div>
    </div>

    <script src="p5.js"></script>
    <script src="sketch.js"></script>
</body>
</html>
